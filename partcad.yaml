# The package path this catalogue is published at inside partcad-index, so
# that standalone development uses the very same addresses its consumers will.
name: //pub/std/manufacturing/material/plastic

# Every density below is in kg/m^3, which is the unit PartCAD reads a density in
# from the release that resolves a part's mass from its material. Before it, a
# density was read in g/mm^3, in which the same substance is a number a million
# times smaller - so an older PartCAD would make every part made of these
# materials weigh a million times what it does. It is refused here rather than
# left to weigh anything.
# 0.8.174 is the release partcad/partcad#755 landed in.
partcad: ">=0.8.174"

desc: Standard polymers - thermoplastics, composites and elastomers - as PartCAD materials.

# Two conventions this file keeps, so that a reader does not have to work them
# out from the entries:
#
# * 'density' is kg/m^3, the one unit PartCAD has for a density. A datasheet
#   often quotes g/cm^3, 1000x smaller: PLA at 1.32 g/cm^3 is 1320 here. A
#   filled grade is denser than the resin it is filled with, which is why the
#   glass- and carbon-filled entries state a density of their own rather than
#   borrowing the unfilled one.
#
# * 'mu' is a typical dry sliding coefficient against the counterface the
#   material actually runs against - polished steel for the bearing plastics,
#   dry pavement for the tyre rubbers - and each entry that states one says
#   which. It is stated only where the tables agree; where they do not, it is
#   left out rather than invented, and a part made of such a material gets the
#   simulator's default exactly as it did before anybody catalogued it.
# What an analysis of a part made of one of these is solved with -- the
# 'youngsModulus' (Pa), 'poissonsRatio', 'yieldStrength' (Pa) and
# 'thermalConductivity' (W/(m*K)) beside each density -- is stated only where it
# is known for the material named, and the comment beside each value says which
# grade, in which condition, and where the number comes from. A property that is
# absent was not known well enough to state: a part made of the material is then
# analysed at the implementation's own default for it, which is visibly a
# default, rather than at a guess that looks like a fact. PartCAD 0.10.17 and
# later read these keys and hand them to a part's analyses. An older one ignores
# them, and only its 'pc lint' reports them as unknown, so the 'partcad:' floor
# above stays where it is: nothing an older PartCAD reads here has changed.
materials:
  #
  # Commodity and printable thermoplastics
  #
  pla:
    formal: PLA
    full: Polylactic Acid
    desc: |
      PLA (Polylactic Acid) is a semi-crystalline thermoplastic polymer.
      Made from cornstarch or sugarcane it is tough and resistant while also being biodegradable.
      However, this origin can cause it to not be resistant to water or chemicals.
    url: https://en.wikipedia.org/wiki/Polylactic_acid
    # img: images/pla.png
    density: 1320 # kg/m^3
    youngsModulus: 3.6e+9 # Pa, NatureWorks Ingeo 4043D; ASTM D882, 23 C (as on the NatureWorks TDS; resin data, not a printed part). NatureWorks, Ingeo Biopolymer 4043D Technical Data Sheet (3D printing monofilament grade), https://cdn.shopify.com/s/files/1/1223/5992/files/PLA_4043D_TDS.pdf
    yieldStrength: 6.0e+7 # Pa, NatureWorks Ingeo 4043D; ASTM D882 tensile yield strength, 23 C. NatureWorks, Ingeo Biopolymer 4043D Technical Data Sheet (3D printing monofilament grade), https://cdn.shopify.com/s/files/1/1223/5992/files/PLA_4043D_TDS.pdf
    thermalConductivity: 0.13 # W/(m*K), generic PLA filament (SD3D); ASTM C518, room temperature. SD3D, PLA Technical Data Sheet (printed filament), hosted at https://3dp.seas.harvard.edu/files/2023/01/PLAMDS.pdf
    tags:
      - low-cost
      - impact-resistant
      - biodegradable
  abs:
    formal: ABS
    full: Acrylonitrile Butadiene Styrene
    desc: |
      ABS (Acrylonitrile Butadiene Styrene) is an amphorus thermoplastic polymer known for its durability and impact resistance.
      Parts made from this material will hold up well to wear and tear.
      A common example of an ABS material are LEGO building blocks.
      ABS is composed of about 50% styrene with various amounts of butadiene and acrylonitrile.
      The styrene provides the strength in this molecule, while the butadiene provides toughness,
      and the acrylonitrile provideds the chemical resistance and heat stablitity.
    url: https://en.wikipedia.org/wiki/Acrylonitrile_butadiene_styrene
    density: 1070
    youngsModulus: 2.3e+9 # Pa, INEOS Styrolution Terluran GP-35; ISO 527, injection-moulded specimen, 23 C. INEOS Styrolution, Terluran GP-35 product data sheet (rev. 05/30/16), https://www.tekogehause.de/uploads/manuali/materiali/TERLURAN%20C-35.pdf
    poissonsRatio: 0.35 # ABS, unfilled (handbook); 23 C. Machinery's Handbook, 31st ed. (Industrial Press, 2020), 'Stress and Strain in Plastics', Table 1 'Poisson's Ratio at 23 C for Resins and Compounds', p. 566; viewed at https://online.flippingbook.com/view/954192180/629/
    yieldStrength: 4.4e+7 # Pa, INEOS Styrolution Terluran GP-35; ISO 527 tensile stress at yield, 23 C. INEOS Styrolution, Terluran GP-35 product data sheet (rev. 05/30/16), https://www.tekogehause.de/uploads/manuali/materiali/TERLURAN%20C-35.pdf
    thermalConductivity: 0.17 # W/(m*K), INEOS Styrolution Terluran GP-35; DIN 52612-1. INEOS Styrolution, Terluran GP-35 product data sheet (rev. 05/30/16), https://www.tekogehause.de/uploads/manuali/materiali/TERLURAN%20C-35.pdf
    tags:
      - heat-resistant
      - impact-resistant
      - chemical-resistant
  asa:
    formal: ASA
    full: Acrylonitrile Styrene Acrylate
    desc: |
      ABS with the butadiene replaced by an acrylate rubber, which is the part
      of ABS that ultraviolet light destroys. It is therefore the one of the
      two that goes outdoors and stays there: automotive exterior trim,
      mirror housings, radiator grilles, antenna and sensor covers, and
      printed parts for robots that live outside.
    url: https://en.wikipedia.org/wiki/Acrylonitrile_styrene_acrylate
    density: 1070
    youngsModulus: 2.3e+9 # Pa, INEOS Styrolution Luran S 777K; ISO 527-1, injection-moulded specimen, 23 C. INEOS Styrolution Luran S 777K datasheet (UL Prospector copy), https://protolabs.com/media/43bexs4t/luran-s-777k.pdf
    yieldStrength: 4.8e+7 # Pa, INEOS Styrolution Luran S 777K; ISO 527-2 tensile stress at yield, 23 C. INEOS Styrolution Luran S 777K datasheet (UL Prospector copy), https://protolabs.com/media/43bexs4t/luran-s-777k.pdf
    thermalConductivity: 0.17 # W/(m*K), INEOS Styrolution Luran S 777K; DIN 52612. INEOS Styrolution Luran S 777K datasheet (UL Prospector copy), https://protolabs.com/media/43bexs4t/luran-s-777k.pdf
    tags:
      - uv-resistant
      - weatherable
      - impact-resistant
      - automotive
  petg:
    formal: PETG
    full: Glycol-modified Polyethylene Terephthalate
    desc: |
      The glycol modification stops PET crystallising, which is what makes
      this printable and thermoformable. Tougher and far less brittle than
      PLA, dimensionally stable where ABS warps, and clear enough for guards
      and covers: machine guarding, fluid-handling parts, sensor windows and
      most printed fixtures that have to survive being handled.
    url: https://en.wikipedia.org/wiki/Polyethylene_terephthalate
    density: 1270
    youngsModulus: 2.1e+9 # Pa, Eastman Eastar 6763 copolyester (PETG); ISO 527 (ASTM D638 gives the same), injection-moulded, 23 C. Eastman, Eastar Copolyester 6763 Technical Data Sheet, https://plasticker.de/docs/recybase/43561_1720088124.pdf
    yieldStrength: 5.0e+7 # Pa, Eastman Eastar 6763 copolyester (PETG); ISO 527 tensile stress at yield, 23 C. Eastman, Eastar Copolyester 6763 Technical Data Sheet, https://plasticker.de/docs/recybase/43561_1720088124.pdf
    thermalConductivity: 0.21 # W/(m*K), Eastman Eastar 6763 copolyester (PETG); ASTM C177. Eastman, Eastar Copolyester 6763 Technical Data Sheet, https://plasticker.de/docs/recybase/43561_1720088124.pdf
    tags:
      - impact-resistant
      - chemical-resistant
      - transparent
      - printable
  pc:
    formal: PC
    full: Polycarbonate
    desc: |
      The transparent engineering thermoplastic, and about as impact resistant
      as a polymer gets - machine guarding, headlamp lenses, canopies, drone
      shells, battery and connector housings. It stays usable to around 120 C,
      it is attacked by many solvents, and it is notorious for cracking later
      where it was left stressed or attacked by the wrong adhesive.
    url: https://en.wikipedia.org/wiki/Polycarbonate
    density: 1200
    youngsModulus: 2.35e+9 # Pa, SABIC (GE Plastics) Lexan 141R; ISO 527-1/-2, 1 mm/min, injection-moulded, 23 C. GE Plastics, PC LEXAN 141R datasheet (09 Feb 2005), https://rolec.com/fileadmin/Media/58/d3/Datenblatt_technoCASE_PC_LEXAN%2B141R_en.pdf
    poissonsRatio: 0.37 # Polycarbonate (handbook); 23 C. Machinery's Handbook, 31st ed. (Industrial Press, 2020), 'Stress and Strain in Plastics', Table 1 'Poisson's Ratio at 23 C for Resins and Compounds', p. 566; viewed at https://online.flippingbook.com/view/954192180/629/
    yieldStrength: 6.3e+7 # Pa, SABIC (GE Plastics) Lexan 141R; ISO 527 tensile stress at yield, 50 mm/min, 23 C. GE Plastics, PC LEXAN 141R datasheet (09 Feb 2005), https://rolec.com/fileadmin/Media/58/d3/Datenblatt_technoCASE_PC_LEXAN%2B141R_en.pdf
    thermalConductivity: 0.2 # W/(m*K), SABIC (GE Plastics) Lexan 141R; ISO 8302. GE Plastics, PC LEXAN 141R datasheet (09 Feb 2005), https://rolec.com/fileadmin/Media/58/d3/Datenblatt_technoCASE_PC_LEXAN%2B141R_en.pdf
    tags:
      - impact-resistant
      - transparent
      - heat-resistant
      - automotive
  pmma:
    formal: PMMA
    full: Poly(methyl methacrylate)
    desc: |
      Acrylic: harder, clearer and far more scratch resistant than
      polycarbonate, and much more brittle. Laser-cut panels and enclosures,
      light pipes and lenses, tail-light lenses, instrument covers and
      anything that has to be seen through and not touched much.
    url: https://en.wikipedia.org/wiki/Acrylic_glass
    density: 1180
    youngsModulus: 3.3e+9 # Pa, Roehm PLEXIGLAS GS (cast acrylic sheet); ISO 527-2/1B/1, 23 C. Roehm, PLEXIGLAS GS/XT Technical Information, Ref. No. 211-1 (04/25), https://www.voskunststoffen.nl/files/166151/datasheet%20plexiglas%20XT%20GS.pdf
    poissonsRatio: 0.37 # Roehm PLEXIGLAS GS (cast acrylic sheet); ISO 527-1. Roehm, PLEXIGLAS GS/XT Technical Information, Ref. No. 211-1 (04/25), https://www.voskunststoffen.nl/files/166151/datasheet%20plexiglas%20XT%20GS.pdf
    thermalConductivity: 0.19 # W/(m*K), Roehm PLEXIGLAS GS (cast acrylic sheet); DIN 52612. Roehm, PLEXIGLAS GS/XT Technical Information, Ref. No. 211-1 (04/25), https://www.voskunststoffen.nl/files/166151/datasheet%20plexiglas%20XT%20GS.pdf
    tags:
      - transparent
      - uv-resistant
      - scratch-resistant
      - brittle
  pp:
    formal: PP
    full: Polypropylene
    desc: |
      Cheap, light, chemically almost inert, and the only common plastic whose
      hinge survives being folded a million times - so bumpers, interior trim,
      battery cases, ducting, tanks and every living hinge are made of it.
      Hard to bond or paint without treating the surface first, and it creeps
      under sustained load.
    url: https://en.wikipedia.org/wiki/Polypropylene
    density: 905
    youngsModulus: 1.7e+9 # Pa, SABIC PP 575P (homopolymer, injection moulding); ISO 527-2/1A/1, 23 C. SABIC PP 575P datasheet (UL Prospector copy), https://sushengpolymer.com/media/pdf/EbXGHq_SABIC-PP-575P.pdf
    yieldStrength: 3.6e+7 # Pa, SABIC PP 575P (homopolymer, injection moulding); ISO 527-2/1A/50 tensile stress at yield, 23 C. SABIC PP 575P datasheet (UL Prospector copy), https://sushengpolymer.com/media/pdf/EbXGHq_SABIC-PP-575P.pdf
    thermalConductivity: 0.2 # W/(m*K), Roechling Polystone P homopolymer (PP-H sheet); DIN 52612-1. Roechling, Polystone P (Homopolymer) EHS natural technical data sheet [718584], https://roechling.com/fileadmin/assets/Technical%20Data%20Sheet%20Polystone%C2%AE%20P%20(Homopolymer)%20EHS%20natural%20718584%20ES.pdf
    tags:
      - low-cost
      - chemical-resistant
      - fatigue-resistant
      - automotive
  hdpe:
    formal: HDPE
    full: High-density Polyethylene
    desc: |
      The tank and bottle plastic: blow-moulded fuel tanks, coolant and washer
      reservoirs, fluid lines, cutting boards and wear strips. Tough down to
      low temperatures, unaffected by most chemicals, and effectively unglueable
      - it is welded instead.
    url: https://en.wikipedia.org/wiki/High-density_polyethylene
    density: 950
    youngsModulus: 1.0e+9 # Pa, Roechling Polystone G natur (PE-HD, PE 300); DIN EN ISO 527, extruded/pressed sheet, 23 C. Roechling, Polystone G natur (PE-HD / PE 300) Technisches Datenblatt, version 12.0 (17/07/2024), https://www.roechling.com/fileadmin/assets/Polystone%C2%AE%20G%20natur%20%E2%80%93%20Technisches%20Datenblatt%20%28DE%29.pdf
    yieldStrength: 2.5e+7 # Pa, Roechling Polystone G natur (PE-HD, PE 300); DIN EN ISO 527 yield stress, 23 C. Roechling, Polystone G natur (PE-HD / PE 300) Technisches Datenblatt, version 12.0 (17/07/2024), https://www.roechling.com/fileadmin/assets/Polystone%C2%AE%20G%20natur%20%E2%80%93%20Technisches%20Datenblatt%20%28DE%29.pdf
    thermalConductivity: 0.4 # W/(m*K), Roechling Polystone G natur (PE-HD, PE 300); DIN 52612-1. Roechling, Polystone G natur (PE-HD / PE 300) Technisches Datenblatt, version 12.0 (17/07/2024), https://www.roechling.com/fileadmin/assets/Polystone%C2%AE%20G%20natur%20%E2%80%93%20Technisches%20Datenblatt%20%28DE%29.pdf
    tags:
      - low-cost
      - chemical-resistant
      - low-friction
      - automotive
  pvc:
    formal: PVC
    full: Polyvinyl Chloride
    desc: |
      Rigid as conduit, trunking, sheet and pipe; plasticised as wire
      insulation, grommets, seals and underbody coatings. Inherently flame
      retardant and cheap, which is what keeps it in buildings and wiring
      looms, but it softens early and the chlorine in it makes both machining
      swarf and fires unpleasant.
    url: https://en.wikipedia.org/wiki/Polyvinyl_chloride
    density: 1400
    youngsModulus: 3.0e+9 # Pa, Roechling Trovidur PVC-U white (rigid sheet); DIN EN ISO 527, 23 C. Roechling, Trovidur PVC-U white technical data sheet [591337], https://www.roechling.com/fileadmin/assets/Technical%20Data%20Sheet%20Trovidur%C2%AE%20PVC-U%20white%20591337%20FR.pdf
    poissonsRatio: 0.38 # PVC, rigid (textbook); room temperature. Callister, Materials Science and Engineering: An Introduction, 7th ed. (Wiley, 2007), as tabulated with citation at https://amesweb.info/Materials/Poissons_Ratio_of_Polymers.aspx
    yieldStrength: 4.5e+7 # Pa, Roechling Trovidur PVC-U white (rigid sheet); DIN EN ISO 527 yield stress, 23 C. Roechling, Trovidur PVC-U white technical data sheet [591337], https://www.roechling.com/fileadmin/assets/Technical%20Data%20Sheet%20Trovidur%C2%AE%20PVC-U%20white%20591337%20FR.pdf
    thermalConductivity: 0.2 # W/(m*K), Roechling Trovidur PVC-U white (rigid sheet); DIN 52612-1. Roechling, Trovidur PVC-U white technical data sheet [591337], https://www.roechling.com/fileadmin/assets/Technical%20Data%20Sheet%20Trovidur%C2%AE%20PVC-U%20white%20591337%20FR.pdf
    tags:
      - low-cost
      - flame-retardant
      - chemical-resistant
      - electrical-insulator

  #
  # Engineering thermoplastics
  #
  nylon:
    formal: Nylon
    full: Nylon
    desc: |
      Nylon (Polyamide), or PA, is a semi-crystaline polymer made from two monomers with each monomer containing six carbon atoms.
      There is another form of Nylon that has twelve carbon atoms.
      The amount of carbon atoms effects the stiffness of the material and the melting point.
      It is tough, flexible, and non-biodegradable.
      However, due to its structure it is prone to absorb water which causes a chemical change of the material and effects the material properties.
    url: https://en.wikipedia.org/wiki/Nylon
    density: 1150
    youngsModulus: 3.1e+9 # Pa, DuPont Zytel 101L NC010 (PA66, unreinforced); ISO 527-1/-2, dry as moulded, 23 C. DuPont, Zytel 101L NC010 product information (ISO data), https://quickparts.com/wp-content/uploads/2023/04/zytel%C2%AE-101l-nc010-gb.pdf
    poissonsRatio: 0.37 # DuPont Zytel 101L NC010 (PA66, unreinforced); dry as moulded. DuPont, Zytel 101L NC010 product information (ISO data), https://quickparts.com/wp-content/uploads/2023/04/zytel%C2%AE-101l-nc010-gb.pdf
    yieldStrength: 8.2e+7 # Pa, DuPont Zytel 101L NC010 (PA66, unreinforced); ISO 527-1/-2 yield stress, 50 mm/min, dry as moulded, 23 C. DuPont, Zytel 101L NC010 product information (ISO data), https://quickparts.com/wp-content/uploads/2023/04/zytel%C2%AE-101l-nc010-gb.pdf
    thermalConductivity: 0.24 # W/(m*K), DuPont Zytel 101L NC010 (PA66, unreinforced); ISO 22007-2. DuPont, Zytel 101L NC010 product information (ISO data), https://quickparts.com/wp-content/uploads/2023/04/zytel%C2%AE-101l-nc010-gb.pdf
    mu: 0.3 # dry against polished steel
    tags:
      - durable
      - abrasion-resistant
      - flexible
  pa12:
    formal: PA12
    full: Polyamide 12 (Nylon 12)
    desc: |
      The nylon that barely absorbs water, which is what makes it dimensionally
      stable where PA6 and PA66 swell: fuel and brake lines, pneumatic tubing,
      cable jacketing, and almost every part that comes out of an SLS or MJF
      machine. Tough and flexible at low temperature, and weaker and pricier
      than PA66.
    url: https://en.wikipedia.org/wiki/Nylon_12
    density: 1010
    youngsModulus: 1.7e+9 # Pa, EOS PA 2200 (PA12, laser sintered); DIN EN ISO 527, laser-sintered parts, 23 C. EOS, Product Information 'Feinpolyamide PA 2200 for EOSINT P', https://www.amf.uzh.ch/dam/jcr:59a8b14a-c212-4693-8443-d5e543aeabe2/Material-Data-PA2200-ENGLISH.pdf
    thermalConductivity: 0.136 # W/(m*K), EOS PA 2200 (PA12, laser sintered); DIN 52616. EOS, Product Information 'Feinpolyamide PA 2200 for EOSINT P', https://www.amf.uzh.ch/dam/jcr:59a8b14a-c212-4693-8443-d5e543aeabe2/Material-Data-PA2200-ENGLISH.pdf
    tags:
      - dimensionally-stable
      - chemical-resistant
      - flexible
      - printable
  pa66-gf30:
    formal: PA66-GF30
    full: Polyamide 66 with 30% glass fibre
    desc: |
      The structural plastic of a vehicle and of a robot: 30% chopped glass
      turns nylon into something stiff and creep resistant enough for gear
      housings, intake manifolds, pedal boxes, brackets, motor mounts and
      connector bodies that see heat. The glass is abrasive to the tooling and
      to whatever the part runs against, and the fibres leave the moulded part
      stiffer along the flow than across it.
    url: https://en.wikipedia.org/wiki/Nylon_66
    density: 1370
    youngsModulus: 1.0e+10 # Pa, BASF Ultramid A3EG6 (PA66-GF30); ISO 527-2, dry as moulded, 23 C. BASF, Ultramid A3EG6 datasheet (UL Prospector copy), https://sushengpolymer.com/media/pdf/VD8rbH_Ultramid-A3EG6.pdf
    poissonsRatio: 0.34 # DuPont Zytel 70G33HS1L (PA66-GF33); ISO 527, dry as moulded. DuPont, Zytel 70G33HS1L NC010 datasheet (UL Prospector copy), https://www.protolabs.com/media/hxudykda/zytel-70g33hs1l.pdf
    tags:
      - glass-filled
      - stiff
      - heat-resistant
      - automotive
      - structural
  pa6-cf:
    formal: PA6-CF
    full: Polyamide 6 with chopped carbon fibre
    desc: |
      Chopped carbon fibre in nylon: the stiff, dimensionally stable filament
      that printed robot end effectors, arms, drone frames and fixtures are
      made of when a printed part has to hold a load rather than a shape. Far
      stiffer and less prone to warp than unfilled nylon, still nowhere near a
      continuous-fibre laminate, and it wants a hardened nozzle.
    url: https://en.wikipedia.org/wiki/Carbon-fiber-reinforced_polymer
    density: 1200
    youngsModulus: 8.64e+9 # Pa, Polymaker Fiberon PA6-CF20 (printed); ISO 527, printed X-Y direction, dry, 100% infill. Polymaker, Fiberon PA6-CF20 Technical Data Sheet V1.1, https://fiberon.polymaker.com/wp-content/uploads/TDS_FIBERON-PA6-CF20_V1.1_EN.pdf
    tags:
      - carbon-filled
      - stiff
      - lightweight
      - printable
      - robotics
  pom:
    formal: POM
    full: Polyoxymethylene (Acetal, Delrin)
    desc: |
      The machinist's and the gear designer's plastic: stiff, strong, slippery,
      and it holds its size because it hardly absorbs water at all. Spur and
      worm gears, bushings, cams, rollers, fuel-system and window-mechanism
      parts, and anything small turned out of rod. It is hard to bond, it
      burns rather than resists flame, and it is attacked by strong acids.
    url: https://en.wikipedia.org/wiki/Polyoxymethylene
    density: 1410
    youngsModulus: 3.15e+9 # Pa, DuPont Delrin 100 NC010 (POM homopolymer); ISO 527-2, injection-moulded, 23 C. DuPont, Delrin 100 NC010 datasheet (UL Prospector copy), https://sushengpolymer.com/media/pdf/L1RBhh_Delrin-100-NC010.pdf
    poissonsRatio: 0.35 # Acetal (handbook); 23 C. Machinery's Handbook, 31st ed. (Industrial Press, 2020), 'Stress and Strain in Plastics', Table 1 'Poisson's Ratio at 23 C for Resins and Compounds', p. 566; viewed at https://online.flippingbook.com/view/954192180/629/
    yieldStrength: 7.2e+7 # Pa, DuPont Delrin 100 NC010 (POM homopolymer); ISO 527-2 tensile stress at yield, 23 C. DuPont, Delrin 100 NC010 datasheet (UL Prospector copy), https://sushengpolymer.com/media/pdf/L1RBhh_Delrin-100-NC010.pdf
    thermalConductivity: 0.36 # W/(m*K), Quadrant EPP Delrin acetal (stock shape); ASTM F433. Quadrant Engineering Plastic Products, Quadrant EPP Delrin Acetal datasheet (UL Prospector copy), https://sushengpolymer.com/media/pdf/mstbvC_Quadrant-EPP-Delrin-Acetal.pdf
    mu: 0.2 # dry against polished steel
    tags:
      - low-friction
      - wear-resistant
      - dimensionally-stable
      - machinable
  uhmwpe:
    formal: UHMWPE
    full: Ultra-high-molecular-weight Polyethylene
    desc: |
      Polyethylene with chains so long it stops behaving like polyethylene:
      the most abrasion-resistant plastic in ordinary use, and nearly as
      slippery as PTFE. Chain and belt guides, conveyor wear strips, bearing
      pads, hopper liners, and the bearing surface of an artificial joint.
      It creeps under load and cannot be injection moulded in the usual way.
    url: https://en.wikipedia.org/wiki/Ultra-high-molecular-weight_polyethylene
    density: 940
    youngsModulus: 7.2e+8 # Pa, Celanese GUR 4120; ISO 527-2/1A, 1 mm/min, compression-moulded, 23 C. Celanese, GUR 4120 PE-UHMW datasheet, https://plasticker.de/docs/recybase/44846_1759500889.pdf
    yieldStrength: 1.7e+7 # Pa, Celanese GUR 4120; ISO 527-2/1A tensile stress at yield, 50 mm/min, 23 C. Celanese, GUR 4120 PE-UHMW datasheet, https://plasticker.de/docs/recybase/44846_1759500889.pdf
    thermalConductivity: 0.41 # W/(m*K), Celanese GUR 4120; 23 C, Celanese internal method. Celanese, GUR 4120 PE-UHMW datasheet, https://plasticker.de/docs/recybase/44846_1759500889.pdf
    mu: 0.15 # dry against polished steel
    tags:
      - low-friction
      - abrasion-resistant
      - impact-resistant
      - self-lubricating

  #
  # High-performance thermoplastics
  #
  ptfe:
    formal: PTFE
    full: Polytetrafluoroethylene
    desc: |
      One of the lowest coefficients of friction of any solid, and chemically
      inert to essentially everything, from -200 C to +260 C: seals, sliding
      bearings, wire insulation, gaskets and lined hose. Soft, heavy, it creeps
      badly under load, and nothing sticks to it - including adhesives, which
      is why it is bolted, clamped or etched rather than bonded.
    url: https://en.wikipedia.org/wiki/Polytetrafluoroethylene
    density: 2200
    poissonsRatio: 0.46 # Chemours (DuPont) Teflon PTFE granular resin; 23 C. DuPont/Chemours, Teflon PTFE fluoropolymer resin Properties Handbook, https://cdn.toxicdocs.org/K6/K6RD4NNj8dVar4pb7aORgak4X/K6RD4NNj8dVar4pb7aORgak4X.pdf
    yieldStrength: 9.0e+6 # Pa, Chemours (DuPont) Teflon PTFE granular resin; 23 C (handbook table 'Yield Strength at Various Temperatures'). DuPont/Chemours, Teflon PTFE fluoropolymer resin Properties Handbook, https://cdn.toxicdocs.org/K6/K6RD4NNj8dVar4pb7aORgak4X/K6RD4NNj8dVar4pb7aORgak4X.pdf
    thermalConductivity: 0.25 # W/(m*K), Chemours (DuPont) Teflon PTFE granular resin; 4.6 mm specimen, room temperature. DuPont/Chemours, Teflon PTFE fluoropolymer resin Properties Handbook, https://cdn.toxicdocs.org/K6/K6RD4NNj8dVar4pb7aORgak4X/K6RD4NNj8dVar4pb7aORgak4X.pdf
    mu: 0.04 # dry against polished steel
    tags:
      - low-friction
      - chemical-resistant
      - heat-resistant
      - electrical-insulator
  peek:
    formal: PEEK
    full: Polyether Ether Ketone
    desc: |
      The thermoplastic that replaces metal: it keeps useful strength to about
      250 C, resists nearly every chemical, does not outgas, and is sterilisable
      and implantable. Aircraft interior and engine-bay brackets, bearings and
      seals, semiconductor and vacuum hardware, downhole parts, spinal
      implants, and printed parts where nothing cheaper survives. It costs
      roughly a hundred times what ABS does.
    url: https://en.wikipedia.org/wiki/Polyether_ether_ketone
    density: 1300
    youngsModulus: 4.0e+9 # Pa, Victrex PEEK 450G; ISO 527-1, injection-moulded, 23 C. Victrex, VICTREX PEEK 450G datasheet, https://www.victrex.com/en/downloads/datasheets/victrex-peek-450g
    yieldStrength: 9.8e+7 # Pa, Victrex PEEK 450G; ISO 527-2 tensile stress at yield, 23 C. Victrex, VICTREX PEEK 450G datasheet, https://www.victrex.com/en/downloads/datasheets/victrex-peek-450g
    thermalConductivity: 0.29 # W/(m*K), Victrex PEEK 450G; ISO 22007-4, 23 C, averaged. Victrex, VICTREX PEEK 450G datasheet, https://www.victrex.com/en/downloads/datasheets/victrex-peek-450g
    mu: 0.35 # dry against polished steel
    tags:
      - high-temperature
      - chemical-resistant
      - high-strength
      - biocompatible
      - aviation
  pei:
    formal: PEI
    full: Polyetherimide (ULTEM)
    desc: |
      The aircraft-interior plastic: amber, stiff, stable to about 170 C, and
      it passes the flame, smoke and toxicity requirements that decide what may
      be inside a cabin. Ducting, panels, brackets and seat parts, and the
      grade printed as ULTEM 9085 is what much of the certified printed flight
      hardware is made of.
    url: https://en.wikipedia.org/wiki/Polyetherimide
    density: 1270
    youngsModulus: 3.58e+9 # Pa, SABIC Ultem 1000; ASTM D638 Type I, 5 mm/min, 23 C. SABIC, ULTEM Resin 1000 (Americas) technical data sheet, https://Protolabs.com/media/1020056/ultem-resin_1000_americas_technical_data_sheet.pdf
    poissonsRatio: 0.36 # SABIC Ultem 1000; ASTM E132. SABIC, ULTEM Resin 1000 (Americas) technical data sheet, https://Protolabs.com/media/1020056/ultem-resin_1000_americas_technical_data_sheet.pdf
    yieldStrength: 1.1e+8 # Pa, SABIC Ultem 1000; ASTM D638 tensile stress at yield, 23 C. SABIC, ULTEM Resin 1000 (Americas) technical data sheet, https://Protolabs.com/media/1020056/ultem-resin_1000_americas_technical_data_sheet.pdf
    thermalConductivity: 0.22 # W/(m*K), SABIC Ultem 1000; ASTM C177. SABIC, ULTEM Resin 1000 (Americas) technical data sheet, https://Protolabs.com/media/1020056/ultem-resin_1000_americas_technical_data_sheet.pdf
    tags:
      - high-temperature
      - flame-retardant
      - aviation
      - dimensionally-stable
  pps:
    formal: PPS
    full: Polyphenylene Sulfide
    desc: |
      The under-bonnet plastic: nothing dissolves it below 200 C, it does not
      absorb water, it is inherently flame retardant, and glass-filled grades
      hold their dimensions through a heat cycle. Coolant pumps and impellers,
      thermostat and throttle bodies, connectors, sensor bodies and fuel-system
      parts. Brittle, and it needs a hot mould.
    url: https://en.wikipedia.org/wiki/Polyphenylene_sulfide
    density: 1350
    youngsModulus: 4.0e+9 # Pa, Celanese Fortron 0205 (unfilled PPS); ISO 527-2/1A/1, 23 C. Celanese, Fortron 0205 datasheet (UL Prospector copy), https://sushengpolymer.com/media/pdf/GGawrU_Fortron-0205.pdf
    poissonsRatio: 0.38 # Fortron PPS, unfilled; design-manual value. Ticona/Celanese, 'Designing with Fortron Polyphenylene Sulfide' design manual (FN-10), section 'Poisson's Ratio', https://ww3.cad.de/foren/ubb/uploads/pmax/Fortron_FN-10_3.9.07.pdf
    tags:
      - high-temperature
      - chemical-resistant
      - flame-retardant
      - automotive

  #
  # Polymer-matrix composites
  #
  cfrp:
    formal: CFRP
    full: Carbon-fibre-reinforced polymer
    desc: |
      Continuous carbon fibre in an epoxy matrix: stiffer and stronger for its
      weight than any metal here, which is what puts it in airframe structure,
      Formula 1 monocoques, drone arms, robot links and every place a moving
      part's own mass is the problem. The numbers here are a typical quasi-
      isotropic laminate - a real laminate's stiffness and strength are
      properties of its layup and not of the material, and it is anisotropic,
      it is electrically conductive, and it corrodes aluminium it touches.
    url: https://en.wikipedia.org/wiki/Carbon-fiber-reinforced_polymer
    density: 1550
    tags:
      - composite
      - lightweight
      - stiff
      - aviation
      - anisotropic
  gfrp:
    formal: GFRP
    full: Glass-fibre-reinforced polymer
    desc: |
      Glass fibre in an epoxy or polyester matrix: heavier and much less stiff
      than carbon, a fraction of the price, and an electrical insulator, which
      is why G10/FR-4 sheet ends up as robot chassis plate, battery-pack
      structure and standoffs. Also bodywork, ducting, radomes and pressure
      vessels. Abrasive to cut, and the dust needs respecting.
    url: https://en.wikipedia.org/wiki/Fiberglass
    density: 1850
    tags:
      - composite
      - electrical-insulator
      - low-cost
      - stiff

  #
  # Elastomers
  #
  tpu:
    formal: TPU
    full: Thermoplastic Polyurethane
    desc: |
      Rubber that can be injection moulded and printed: bump stops, bellows,
      grommets, cable strain reliefs, protective bumpers, gaskets, wheels and
      soft-robotic parts, from shore 60A to 85A and up. Exceptionally abrasion
      resistant and tough for its hardness, and it hydrolyses over time in hot
      water.
    url: https://en.wikipedia.org/wiki/Thermoplastic_polyurethane
    density: 1210
    tags:
      - elastomer
      - abrasion-resistant
      - flexible
      - printable
  nr:
    formal: NR
    full: Natural rubber
    desc: |
      The rubber everything else is compared with: the highest grip and the
      best fatigue and tear resistance of the elastomers, which is what keeps
      it in tyre carcasses, robot drive wheels, engine and cab mounts,
      suspension bushings and anti-vibration pads. Ozone, sunlight, oil and
      fuel all attack it, so it stays away from anything petroleum.
    url: https://en.wikipedia.org/wiki/Natural_rubber
    density: 930
    thermalConductivity: 0.15 # W/(m*K), natural rubber, vulcanized; 25 C. C. J. M. Lasance, 'The Thermal Conductivity of Rubbers/Elastomers', Electronics Cooling, Nov 2001, table 'Thermal conductivity of rubbers/elastomers at 25 C', https://www.electronics-cooling.com/2001/11/the-thermal-conductivity-of-rubbers-elastomers/
    mu: 1.0 # rubber on a dry hard surface - the road or floor a wheel runs on
    tags:
      - elastomer
      - high-friction
      - damping
      - fatigue-resistant
  nbr:
    formal: NBR
    full: Nitrile rubber (Buna-N)
    desc: |
      The oil seal: the nitrile in it is what makes it indifferent to fuel,
      oil and grease, and that is the whole reason most O-rings, shaft seals,
      fuel hose liners and hydraulic seals are made of it. Cheap and hard
      wearing, up to about 100 C, and poor in ozone, sunlight and brake fluid.
    url: https://en.wikipedia.org/wiki/Nitrile_rubber
    density: 1000
    thermalConductivity: 0.24 # W/(m*K), nitrile rubber (NBR); 25 C. C. J. M. Lasance, 'The Thermal Conductivity of Rubbers/Elastomers', Electronics Cooling, Nov 2001, table 'Thermal conductivity of rubbers/elastomers at 25 C', https://www.electronics-cooling.com/2001/11/the-thermal-conductivity-of-rubbers-elastomers/
    tags:
      - elastomer
      - oil-resistant
      - sealing
      - low-cost
  epdm:
    formal: EPDM
    full: Ethylene Propylene Diene Monomer rubber
    desc: |
      The weather seal: door and window seals, coolant and radiator hose,
      brake system seals, roofing and wire insulation. It shrugs off ozone,
      sunlight, steam and water where NBR perishes, and it swells and fails in
      fuel and mineral oil, which is the trade it makes.
    url: https://en.wikipedia.org/wiki/EPDM_rubber
    density: 1150
    tags:
      - elastomer
      - weatherable
      - sealing
      - automotive
  fkm:
    formal: FKM
    full: Fluoroelastomer (Viton)
    desc: |
      Where nitrile has given up: fuel-injection and turbo seals, engine and
      gearbox shaft seals, aircraft fuel-system O-rings, chemical and vacuum
      hardware. It holds up in hot oil, fuel and most chemicals to around
      200 C, several times the price, and it is poor in steam and in the cold.
    url: https://en.wikipedia.org/wiki/FKM
    density: 1800
    tags:
      - elastomer
      - high-temperature
      - oil-resistant
      - chemical-resistant
      - aviation
  silicone:
    formal: VMQ
    full: Silicone rubber
    desc: |
      Useful from about -60 C to +200 C, which no organic rubber manages, and
      it is physiologically inert: gaskets and seals that see heat, ignition
      boots, keypads, medical and food tubing, cast soft-robotic actuators and
      the moulds other things are cast in. Mechanically weak - it tears easily
      and abrades quickly - and it swells in fuel and oil.
    url: https://en.wikipedia.org/wiki/Silicone_rubber
    density: 1200
    thermalConductivity: 0.14 # W/(m*K), silicone rubber (VMQ); 25 C. C. J. M. Lasance, 'The Thermal Conductivity of Rubbers/Elastomers', Electronics Cooling, Nov 2001, table 'Thermal conductivity of rubbers/elastomers at 25 C', https://www.electronics-cooling.com/2001/11/the-thermal-conductivity-of-rubbers-elastomers/
    tags:
      - elastomer
      - high-temperature
      - biocompatible
      - sealing
      - castable
